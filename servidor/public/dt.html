<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Visor Territorios</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Admin Territorios" />
    <link rel="apple-touch-icon" href="/pwa-icon.png" />
    <link rel="manifest" href="/manifest-admin.webmanifest">
    <script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family= outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: rgba(255, 255, 255, 0.9);
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --surface-border: rgba(0, 0, 0, 0.08);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.5;
        }

        .glass-card {
            background: var(--bg-secondary);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: -2rem -2rem 2rem -2rem;
            padding: 1.5rem 2rem;
            background: rgba(0, 0, 0, 0.02);
            border-bottom: 2px solid var(--surface-border);
            border-radius: 24px 24px 0 0;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-main {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        select, input[type="text"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        select {
            cursor: pointer;
            min-width: 200px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--surface-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            background: rgba(0, 0, 0, 0.03);
            padding: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--surface-border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Estilos específicos de app.js */
        .tr-rojo { background-color: rgba(239, 68, 68, 0.15) !important; }
        .tr-verde { background-color: rgba(16, 185, 129, 0.15) !important; }
        
        .fecha-alerta { border: 2px solid var(--accent-red) !important; border-radius: 8px; }
        
        .fecha-control {
            width: 155px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 500;
        }

        input[data-field="numero"] {
            width: 65px;
            text-align: center;
            font-weight: 700;
        }

        .active { display: block; }

        .btn-acciones {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .menu-acciones {
            position: absolute;
            background: white;
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 0.5rem;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .oculto { display: none !important; }

        .menu-acciones button {
            background: none;
            border: none;
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .menu-acciones button:hover {
            background: #f1f5f9;
            color: var(--accent-blue);
        }

        .btn-borrar-datos { color: #d97706 !important; }
        .btn-eliminar-fila { color: #dc2626 !important; }

        .guardado { animation: flashGreen 0.8s; }
        .error { animation: flashRed 0.8s; }

        @keyframes flashGreen {
            0% { background: rgba(16, 185, 129, 0.1); }
            100% { background: transparent; }
        }

        @keyframes flashRed {
            0% { background: rgba(239, 68, 68, 0.1); }
            100% { background: transparent; }
        }

        input[data-field] {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-primary);
            padding: 0.4rem;
            border-radius: 6px;
            transition: all 0.2s;
            font-family: inherit;
        }

        input[data-field]:hover {
            background: rgba(0, 0, 0, 0.02);
            border-color: var(--surface-border);
        }

        input[data-field]:focus {
            background: white;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        /* Ancho fijo para columnas específicas en Desktop */
        @media (min-width: 769px) {
            th:nth-child(1), td:nth-child(1) { width: 70px; text-align: center; }
            th:nth-child(3), td:nth-child(3) { width: 140px; text-align: center; }
            th:nth-child(4), td:nth-child(4),
            th:nth-child(5), td:nth-child(5) { width: 160px; text-align: center; }
        }

        input[data-field="numero"], 
        input[data-field="whatsapp"] { text-align: center; }


        input[data-field]:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-blue);
        }

        /* Estilos móviles rudimentarios para administración */
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header { gap: 1rem; }
            .hero-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="header">
            <h1 class="hero-title">Gestión Territorios</h1>
            <div class="controls" style="margin: 0;">
                <select id="filtroPoblacion">
                    <option value="">-- Selecciona población --</option>
                </select>
                <button id="btnNuevoTerritorio" class="btn-main" style="background: var(--accent-green);">
                    ➕ Nuevo
                </button>
            </div>
        </div>

        <section id="registroSection" class="active">


            <div class="table-container">
                <table id="tablaTerritorios">
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Persona Asignada</th>
                            <th>WhatsApp</th>
                            <th>Entrega</th>
                            <th>Devolución</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Las filas se cargan dinámicamente desde app.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Datalist para el autocompletado de nombres (se pobla en app.js) -->
    <datalist id="listaNombres"></datalist>

    <!-- Scripts de Datos (Asegúrate de que existan en esta misma carpeta) -->
    <script src="contactos.js"></script>
    <script src="datos.js"></script>

    <!-- Script Principal -->
    <script type="module" src="app.js"></script>

</body>
</html>
