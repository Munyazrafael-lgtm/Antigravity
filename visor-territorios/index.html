<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Visor Territorios" />
    <link rel="apple-touch-icon" href="/pwa-icon.png" />
    <title>Visor Territorios</title>
    <meta name="description" content="Visualizador de territorios PWA premium y dinámico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Limpiar Service Workers antiguos y caches obsoletas que causan pantalla blanca
      if ('serviceWorker' in navigator) {
        // 1. Eliminar SWs con scope incorrecto (legacy /pwa/)
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            if (reg.scope.includes('/pwa/') || reg.scope !== (location.origin + '/')) {
              reg.unregister();
            }
          });
        });

        // 2. Detectar pantalla blanca: si después de 4s el #root sigue vacío,
        //    limpiar todas las caches y recargar (solo 1 intento por sesión)
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !sessionStorage.getItem('cache_fix_attempted')) {
            sessionStorage.setItem('cache_fix_attempted', '1');
            console.warn('App no cargó correctamente — limpiando caches...');
            // Desregistrar todos los SW y limpiar caches
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).then(function() {
              return caches.keys();
            }).then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            }).then(function() {
              location.reload();
            });
          }
        }, 4000);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
